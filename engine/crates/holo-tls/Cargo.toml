[package]
name = "holo-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HoloNet TLS 1.3 record layer, handshake codec and transcript hash (RFC 8446) — pure std, no X.509 parser, SPKI pinning only"

[dependencies]
holo-crypto = { path = "../holo-crypto" }
# OS entropy ONLY (holo_util::rand::os_fill — fail-closed) for the S2 client/
# server security material (ClientHello randoms, ephemeral x25519 keys, PSS
# salt).  No other holo-util feature is referenced.
holo-util = { path = "../holo-util" }
