name: build
on: [push, workflow_dispatch]

jobs:
  core:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: windows-2019, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: windows-2019, target: i686-pc-windows-msvc, name: windows-x86 }
          - { os: windows-2019, target: x86_64-pc-windows-msvc, name: windows7-x64, rust: "1.77.2" }
          - { os: macos-13, target: x86_64-apple-darwin, name: macos-x64, rust: "1.77.2" }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust || 'stable' }}", targets: "${{ matrix.target }}" }
      - name: Test + build engine
        working-directory: engine
        run: |
          cargo test
          cargo build --release --target ${{ matrix.target }}
      - name: Stage portable
        shell: bash
        run: |
          mkdir -p "dist/holonet-portable-${{ matrix.name }}"
          cp engine/target/${{ matrix.target }}/release/holonetd* "dist/holonet-portable-${{ matrix.name }}/" 2>/dev/null || true
          cp engine/target/${{ matrix.target }}/release/holonetctl* "dist/holonet-portable-${{ matrix.name }}/" 2>/dev/null || true
          cp README.md LICENSE "dist/holonet-portable-${{ matrix.name }}/"
      - uses: actions/upload-artifact@v4
        with: { name: "holonet-${{ matrix.name }}", path: dist/ }

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd app_flutter && flutter build apk --release --split-per-abi || echo "[ci] needs Android SDK"
      - uses: actions/upload-artifact@v4
        with: { name: holonet-apk, path: app_flutter/build/app/outputs/flutter-apk/, if-no-files-found: ignore }
