name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # S1 item 0 COMPLETE (2026-11-20, run 44668106188 @ 2dae1ce): the
    # D-0008 Windows entropy FFI landed and windows-latest runs the FULL
    # suite green as a REQUIRED job — the A3-C3 expected-red window
    # (continue-on-error + warning annotation) was removed at item-0
    # completion, per plan.
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Tests (holo-crypto)
        run: cargo test -p holo-crypto
      - name: Tests (holo-util)
        run: cargo test -p holo-util
      - name: Tests (holo-config)
        run: cargo test -p holo-config
      - name: Tests (holo-theme)
        run: cargo test -p holo-theme
      - name: Tests (holo-proto + holo-net)
        run: |
          cargo test -p holo-proto
          cargo test -p holo-net
      - name: Tests (holo-ss)
        run: cargo test -p holo-ss
      - name: Tests (holo-tls)
        run: cargo test -p holo-tls
      - name: Tests (holo-socks)
        run: |
          cargo test -p holo-socks -- --nocapture --test-threads=1 > socks-test.log 2>&1 || true
          if ! grep -q "test result: ok" socks-test.log; then
            echo "socks tests failed — dumping log as annotations"
            tail -30 socks-test.log | while IFS= read -r line; do echo "::error::${line:0:220}"; done
            exit 1
          fi
      - name: Tests (holo-engine units)
        run: cargo test -p holo-engine --lib
      - name: Tests (holo-engine integration)
        run: cargo test -p holo-engine --test integration
      - name: Tests (bins)
        run: cargo test -p holonetctl -p holonetd
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::error::failing crate identified by which step failed; rerun locally with RUST_BACKTRACE=1 for details"
          cargo test --workspace --no-run 2>&1 | tail -20

  cross-check:
    name: Cross-compile check (musl / Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + cross targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-linux-android armv7-linux-androideabi
      - name: cargo check
        run: |
          cargo check --workspace --target x86_64-unknown-linux-musl
          cargo check --workspace --target aarch64-linux-android
          cargo check --workspace --target armv7-linux-androideabi

  harness-audit:
    name: Harness audit (record chain + hash resolution, full tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: memory graph + RAG regressions (D-0027/D-0028)
        run: |
          set -euo pipefail
          python3 harness/memory/graph/memory_graph.py check
          python3 harness/memory/graph/memory_rag.py smoke
      - name: every quoted hash resolves to a tracked blob; record chains are intact
        run: |
          set -euo pipefail
          # A4-C2 (record 0002): the existence-only audit is replaced by a
          # WHOLE-TREE integrity audit (D-0017 — chosen over the originally
          # suggested origin/main..HEAD range audit because tree-level chain
          # verification is strictly stronger for mutation detection and
          # needs no deep fetch):
          #   1. every 64-hex string quoted in a verdict record or added to
          #      BACKUPS.md resolves to the blob sha256 of a TRACKED file
          #      (warn when the resolution lands outside harness/adversarial/verdicts/);
          #   2. every gate record's final `chain:` line equals the blob
          #      sha256 of the numerically previous record (0001 = "genesis").
          # Verified against blob content (D-0011), never working-tree bytes.
          fail=0
          git ls-files -z | while IFS= read -r -d '' f; do
            h="$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)"
            printf '%s %s\n' "$h" "$f"
          done > /tmp/blobs.txt
          # 1) hash resolution
          scan() {
            for h in $(grep -oE '[0-9a-f]{64}' "$1" 2>/dev/null | sort -u || true); do
              if ! grep -q "^$h " /tmp/blobs.txt; then
                echo "::error::$1 quotes $h — matches NO tracked blob (tampered or stale)"
                fail=1
              fi
            done
          }
          for rec in harness/adversarial/verdicts/*.md; do scan "$rec"; done
          scan harness/memory/BACKUPS.md
          # 2) chain recomputation (records = files whose last line is `chain: `)
          prevhash=""
          prevname="(none)"
          for rec in $(ls harness/adversarial/verdicts/*.md | sort); do
            last="$(tail -n 1 "$rec")"
            case "$last" in
              chain:\ *)
                chain="${last#chain: }"
                name="$(basename "$rec")"
                seq="${name%%-*}"
                if [ "$seq" = "0001" ]; then
                  [ "$chain" = "genesis" ] || { echo "::error::$name: first record's chain must be 'genesis', got '$chain'"; fail=1; }
                elif [ -z "$prevhash" ]; then
                  echo "::error::$name chains to $chain but no predecessor record was seen"
                  fail=1
                elif [ "$chain" != "$prevhash" ]; then
                  echo "::error::$name chain $chain != previous record $prevname blob $prevhash"
                  fail=1
                fi
                prevhash="$(git show "HEAD:$rec" | sha256sum | cut -d' ' -f1)"
                prevname="$name"
                echo "chain OK: $name -> $prevhash"
                ;;
            esac
          done
          exit $fail

  legacy-toolchain:
    name: Rust 1.77.2 compatibility (Win7 / Catalina baseline)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.77.2
        run: |
          rustup toolchain install 1.77.2 --profile minimal --no-self-update
          rustup default 1.77.2
      - name: Check (host)
        run: cargo check --workspace
      - name: Check (x86_64-pc-windows-msvc target)
        run: |
          # S1 item 0 acceptance (A3-C3): the Windows cfg paths — including
          # the D-0008 FFI — must compile on the 1.77.2 floor. check-only,
          # so no linker is needed on this ubuntu host.
          rustup target add x86_64-pc-windows-msvc
          cargo check --workspace --target x86_64-pc-windows-msvc
