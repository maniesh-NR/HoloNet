name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Tests (holo-crypto)
        run: cargo test -p holo-crypto
      - name: Tests (holo-util)
        run: cargo test -p holo-util
      - name: Tests (holo-config)
        run: cargo test -p holo-config
      - name: Tests (holo-theme)
        run: cargo test -p holo-theme
      - name: Tests (holo-proto + holo-net)
        run: |
          cargo test -p holo-proto
          cargo test -p holo-net
      - name: Tests (holo-ss)
        run: cargo test -p holo-ss
      - name: Tests (holo-socks)
        run: |
          cargo test -p holo-socks -- --nocapture --test-threads=1 > socks-test.log 2>&1 || true
          echo "=== log size: $(wc -l < socks-test.log) lines"
          echo "=== HEAD of socks-test.log ==="
          head -15 socks-test.log | while IFS= read -r line; do echo "::error::HEAD|${line:0:220}"; done
          echo "=== TAIL of socks-test.log ==="
          tail -25 socks-test.log | while IFS= read -r line; do echo "::error::TAIL|${line:0:220}"; done
          grep -q "test result: ok" socks-test.log || exit 1
      - name: Tests (holo-engine units)
        run: cargo test -p holo-engine --lib
      - name: Tests (holo-engine integration)
        run: cargo test -p holo-engine --test integration
      - name: Tests (bins)
        run: cargo test -p holonetctl -p holonetd
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::error::failing crate identified by which step failed; rerun locally with RUST_BACKTRACE=1 for details"
          cargo test --workspace --no-run 2>&1 | tail -20

  cross-check:
    name: Cross-compile check (musl / Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + cross targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-linux-android armv7-linux-androideabi
      - name: cargo check
        run: |
          cargo check --workspace --target x86_64-unknown-linux-musl
          cargo check --workspace --target aarch64-linux-android
          cargo check --workspace --target armv7-linux-androideabi

  legacy-toolchain:
    name: Rust 1.77.2 compatibility (Win7 / Catalina baseline)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.77.2
        run: |
          rustup toolchain install 1.77.2 --profile minimal --no-self-update
          rustup default 1.77.2
      - name: Check
        run: cargo check --workspace
