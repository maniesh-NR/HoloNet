name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: engine/test-output.txt
          if-no-files-found: ignore

  cross-check:
    name: Cross-compile check (musl / Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + cross targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-linux-android armv7-linux-androideabi
      - name: cargo check
        run: |
          cargo check --workspace --target x86_64-unknown-linux-musl
          cargo check --workspace --target aarch64-linux-android
          cargo check --workspace --target armv7-linux-androideabi

  legacy-toolchain:
    name: Rust 1.77.2 compatibility (Win7 / Catalina baseline)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.77.2
        run: |
          rustup toolchain install 1.77.2 --profile minimal --no-self-update
          rustup default 1.77.2
      - name: Check
        run: cargo check --workspace
